version: '3.7'

services:
  postgres_airflow:
    image: postgres:13
    container_name: pythonproject-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - my_custom_network

  postgres_shop:
    image: postgres:13
    container_name: pythonproject-postgres-shop
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - postgres-shop-data:/var/lib/postgresql/data
    networks:
      - my_custom_network

  mysql:
    image: mysql:8.0
    container_name: airflow_mysql1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow
    ports:
      - "3306:3306"
    networks:
      - my_custom_network

  webserver:
    image: apache/airflow:2.8.1
    container_name: pythonproject-webserver-1
    depends_on:
      - postgres_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__WEBSERVER__RBAC: "True"
    ports:
      - "9090:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: bash -c "airflow db init && airflow webserver"
    networks:
      - my_custom_network
    restart: always

  scheduler:
    image: apache/airflow:2.8.1
    container_name: pythonproject-scheduler-1
    depends_on:
      - postgres_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: bash -c "airflow scheduler"
    networks:
      - my_custom_network
    restart: always

volumes:
  postgres-airflow-data:
  postgres-shop-data:

networks:
  my_custom_network:
    driver: bridge